<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Cats</title>
        <link rel="stylesheet" href="style.css">
        <script defer src="script.js"></script>
    </head>
    <body> 
    <div class="main-wrapper">
        <div class="typewriter" id ="title">
            <h1>Do you want to meet my cats?:3</h1>
        </div>
        <div class="gradient-border" id="yes-button">Yes</div>
        <div class="gradient-border" id="no-button">No</div>
        <h1 id="catName">LUNA</h1>   
        <div class="container">
            <div class="button" id="buttonback" >
                <h2>&lt;</h2>
            </div>
            <img id="catImg" src="images/luna.jpg" alt="Luna">
            <div class="button" id="buttonext" > 
                <h2>&gt;</h2>
            </div>
        </div>
        <div class="typewriter id="achiv">
            <h2 id="achiv">Achivements</h2>   
        </div>
        <p id="catInfo" style="white-space: pre-line">•can sleep 25 hours in a day
            •smoll kitty</p>
    </div>
</body>

</html>
